name: Validar e publicar Circuito
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Calcular caminho do projeto
        shell: bash
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          if [ "${repo,,}" = "$owner.github.io" ]; then
            echo 'VITE_BASE_PATH=/' >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/$repo/" >> "$GITHUB_ENV"
          fi
      - name: Validar TypeScript
        run: npm run typecheck
      - name: Testar schema, migrações e regras
        run: npm test
      - name: Build de produção e PWA
        run: npm run build
      - name: Validar arquivos estáticos e caminhos
        run: npm run check:dist
      - name: Instalar navegador de testes
        run: npx playwright install --with-deps chromium
      - name: Testar interface em subdiretório e offline
        run: npm run test:ui
      - name: Preparar Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Enviar build para Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
